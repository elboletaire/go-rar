name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      # Real RAR readers check the writer's output: the official 7-Zip build
      # (Debian's lacks the RAR codec) and libarchive's bsdtar.
      - name: Install 7-Zip and bsdtar
        if: runner.os == 'Linux'
        env:
          SEVENZIP_URL: https://github.com/ip7z/7zip/releases/download/26.04/7z2604-linux-x64.tar.xz
          SEVENZIP_SHA256: fc0327ba27e89bd086cf426dff17d77de582953cdbbc10a6576540a06853ffcd
        run: |
          curl -sSfL -o /tmp/7z.tar.xz "$SEVENZIP_URL"
          echo "$SEVENZIP_SHA256  /tmp/7z.tar.xz" | sha256sum -c -
          sudo tar xJf /tmp/7z.tar.xz -C /usr/local/bin 7zz
          sudo ln -sf /usr/local/bin/7zz /usr/local/bin/7z
          sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools
          7z i | grep -E ' Rar +rar'
          bsdtar --version
      - name: Test (with oracles)
        if: runner.os == 'Linux'
        env:
          RAR_ORACLES: require
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzDecodeName, FuzzNameRoundTrip]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=60s .
